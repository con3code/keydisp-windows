name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Core は net8.0 プレーンなので最速の ubuntu ランナーでテストする
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/KeyDisp.Core.Tests -c Release --nologo

  # XAML コンパイルと WinExe リンクを Windows 上で必ず 1 回通す
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/KeyDisp.App -c Release -r win-x64
          --self-contained
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -o publish
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath KeyDisp-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KeyDisp-win-x64
          path: KeyDisp-win-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyDisp-win-x64
      - name: Rename with version
        run: mv KeyDisp-win-x64.zip "KeyDisp-${GITHUB_REF_NAME}-win-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: KeyDisp-*-win-x64.zip
